<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title">Create New Blog</h2>

          <div class="alert alert-danger" *ngIf="error">
            {{ error }}
          </div>

          <form [formGroup]="blogForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="title" class="form-label">Title *</label>
              <input 
                type="text" 
                class="form-control" 
                id="title" 
                formControlName="title"
                [class.is-invalid]="blogForm.get('title')?.invalid && blogForm.get('title')?.touched">
              <div class="invalid-feedback">
                Title must be at least 3 characters
              </div>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description *</label>
              <textarea 
                class="form-control" 
                id="description" 
                rows="8"
                formControlName="description"
                [class.is-invalid]="blogForm.get('description')?.invalid && blogForm.get('description')?.touched"
                placeholder="Write your blog content here..."></textarea>
              <div class="invalid-feedback">
                Description must be at least 10 characters
              </div>
            </div>

            <div class="mb-3">
              <label for="imageUrl" class="form-label">Image URLs (optional)</label>
              <div class="input-group">
                <input 
                  type="text" 
                  class="form-control" 
                  id="imageUrl" 
                  formControlName="imageUrl"
                  placeholder="https://example.com/image.jpg">
                <button class="btn btn-outline-secondary" type="button" (click)="addImage()">
                  <i class="bi bi-plus"></i> Add
                </button>
              </div>
              <small class="text-muted">Add image URLs one at a time. Images will be displayed in a uniform grid.</small>
            </div>

            <div *ngIf="imageUrls.length > 0" class="mb-3">
              <label class="form-label">Added Images:</label>
              <div class="row g-3">
                <div class="col-md-6" *ngFor="let url of imageUrls; let i = index">
                  <div class="card">
                    <img [src]="url" class="card-img-top" style="height: 200px; object-fit: cover;" alt="Preview" 
                         onerror="this.src='https://via.placeholder.com/400x200?text=Invalid+Image'">
                    <div class="card-body p-2">
                      <small class="text-truncate d-block">{{ url }}</small>
                      <button type="button" class="btn btn-sm btn-danger mt-2 w-100" (click)="removeImage(i)">
                        <i class="bi bi-trash"></i> Remove
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="loading || blogForm.invalid">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ loading ? 'Creating...' : 'Create Blog' }}
              </button>
              <button type="button" class="btn btn-secondary" (click)="cancel()">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
