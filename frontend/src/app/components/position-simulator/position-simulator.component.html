<div class="container-fluid h-100">
  <div class="row h-100">
    <div class="col-12">
      <div class="card mb-3">
        <div class="card-body">
          <h3 class="card-title">
            <i class="bi bi-geo-alt-fill"></i> Position Simulator
          </h3>
          <p class="text-muted mb-2">
            Click anywhere on the map to set your current position. This will be used during tour execution.
          </p>
          
          <div *ngIf="currentPosition" class="alert alert-info mb-2">
            <strong>Current Position:</strong> 
            Latitude: {{ currentPosition.latitude.toFixed(6) }}, 
            Longitude: {{ currentPosition.longitude.toFixed(6) }}
          </div>

          <div *ngIf="message" class="alert" 
               [ngClass]="message.includes('Failed') ? 'alert-danger' : 'alert-success'">
            {{ message }}
          </div>

          <div *ngIf="loading" class="text-center">
            <div class="spinner-border spinner-border-sm" role="status">
              <span class="visually-hidden">Updating...</span>
            </div>
            <span class="ms-2">Updating position...</span>
          </div>
        </div>
      </div>

      <div id="map" class="map-container"></div>
    </div>
  </div>
</div>
