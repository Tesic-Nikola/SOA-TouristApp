<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-8">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title">Edit Profile</h2>

          <div class="alert alert-success" *ngIf="success">
            {{ success }}
          </div>

          <div class="alert alert-danger" *ngIf="error">
            {{ error }}
          </div>

          <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="firstName" class="form-label">First Name</label>
              <input 
                type="text" 
                class="form-control" 
                id="firstName" 
                formControlName="firstName">
            </div>

            <div class="mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input 
                type="text" 
                class="form-control" 
                id="lastName" 
                formControlName="lastName">
            </div>

            <div class="mb-3">
              <label for="motto" class="form-label">Motto</label>
              <input 
                type="text" 
                class="form-control" 
                id="motto" 
                formControlName="motto"
                placeholder="Your personal motto or quote">
            </div>

            <div class="mb-3">
              <label for="bio" class="form-label">Bio</label>
              <textarea 
                class="form-control" 
                id="bio" 
                rows="4"
                formControlName="bio"
                placeholder="Tell us about yourself"></textarea>
            </div>

            <div class="mb-3">
              <label for="profileImagePath" class="form-label">Profile Image URL</label>
              <input 
                type="text" 
                class="form-control" 
                id="profileImagePath" 
                formControlName="profileImagePath"
                placeholder="https://example.com/image.jpg">
              <small class="text-muted">For now, use an image URL. File upload coming soon.</small>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ loading ? 'Saving...' : 'Save Changes' }}
              </button>
              <button type="button" class="btn btn-secondary" (click)="cancel()">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
