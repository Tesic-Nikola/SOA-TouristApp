<div class="container mt-4">
  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div *ngIf="user && !loading" class="row">
    <div class="col-4">
      <div class="card">
        <div class="card-body text-center">
          <div *ngIf="!user.profileImagePath" 
               class="rounded-circle mb-3 d-flex align-items-center justify-content-center bg-secondary"
               style="width: 150px; height: 150px; margin: 0 auto;">
            <i class="bi bi-person-fill text-white" style="font-size: 80px;"></i>
          </div>
          <img 
            *ngIf="user.profileImagePath"
            [src]="user.profileImagePath" 
            alt="Profile" 
            class="rounded-circle mb-3"
            style="width: 150px; height: 150px; object-fit: cover;">
          
          <h3>{{ user.username }}</h3>
          <p class="text-muted">{{ getRoleDisplay(user.role) }}</p>
          
          <a 
            *ngIf="isOwnProfile()" 
            [routerLink]="['/profile', user.id, 'edit']" 
            class="btn btn-primary w-100">
            Edit Profile
          </a>
        </div>
      </div>
    </div>

    <div class="col-8">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title">Profile Information</h4>
          
          <div class="mb-3">
            <label class="fw-bold">Email:</label>
            <p>{{ user.email }}</p>
          </div>

          <div class="mb-3" *ngIf="user.firstName || user.lastName">
            <label class="fw-bold">Name:</label>
            <p>{{ user.firstName }} {{ user.lastName }}</p>
          </div>

          <div class="mb-3" *ngIf="user.motto">
            <label class="fw-bold">Motto:</label>
            <p class="fst-italic">"{{ user.motto }}"</p>
          </div>

          <div class="mb-3" *ngIf="user.bio">
            <label class="fw-bold">Bio:</label>
            <p>{{ user.bio }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
