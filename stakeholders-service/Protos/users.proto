syntax = "proto3";

package users;

// User service definition
service UserService {
  rpc GetUser (GetUserRequest) returns (UserResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
}

// Request/Response messages
message GetUserRequest {
  string user_id = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message UserResponse {
  string id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  string first_name = 5;
  string last_name = 6;
  string profile_image_path = 7;
  string bio = 8;
  string motto = 9;
}

message LoginResponse {
  string token = 1;
  UserResponse user = 2;
}
