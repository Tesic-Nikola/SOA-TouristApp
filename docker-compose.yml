services:
  # Databases
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tourist-app-network

  neo4j:
    image: neo4j:5
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    networks:
      - tourist-app-network

  # Microservices
  stakeholders-service:
    build:
      context: ./stakeholders-service
      dockerfile: Dockerfile
    container_name: stakeholders-service
    ports:
      - "8081:8081"
      - "9081:9081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:9081;http://+:8081
      - MongoDB__ConnectionString=mongodb://mongodb:27017
    depends_on:
      - mongodb
    networks:
      - tourist-app-network

  tour-service:
    build:
      context: ./tour-service
      dockerfile: Dockerfile
    container_name: tour-service
    ports:
      - "8084:8084"
      - "9084:9084"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:9084;http://+:8084
      - MongoDB__ConnectionString=mongodb://mongodb:27017
    depends_on:
      - mongodb
    networks:
      - tourist-app-network

  blog-service:
    build:
      context: ./blog-service
      dockerfile: Dockerfile
    container_name: blog-service
    ports:
      - "8082:8082"
    environment:
     - MONGO_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb
    networks:
      - tourist-app-network

  followers-service:
   build:
     context: ./followers-service
     dockerfile: Dockerfile
   container_name: followers-service
   ports:
     - "8083:8083"
   environment:
     - NEO4J_URI=bolt://neo4j:7687
     - NEO4J_USER=neo4j
     - NEO4J_PASSWORD=password
   depends_on:
     - neo4j
   networks:
     - tourist-app-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "5062:5062"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5062
    depends_on:
      - stakeholders-service
      - tour-service
      - blog-service
      - followers-service
    networks:
      - tourist-app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4200:80"
    depends_on:
      - gateway
    networks:
      - tourist-app-network

networks:
  tourist-app-network:
    driver: bridge

volumes:
  mongo_data:
  neo4j_data: